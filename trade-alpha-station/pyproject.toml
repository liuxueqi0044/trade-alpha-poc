[project]
license = { text = "MIT" }
name = "trade-alpha-station"
version = "0.1.0"
description = "Evidence-first, point-in-time global trade intelligence research station"
requires-python = ">=3.12"
dependencies = [
  "dagster>=1.8,<2",
  "duckdb>=1.1,<2",
  "frictionless>=5.18,<6",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "networkx>=3.3,<4",
  "numpy>=2,<3",
  "orjson>=3.10,<4",
  "pandera[polars]>=0.20,<1",
  "pdfplumber>=0.11,<1",
  "perspective-python>=3,<4",
  "pint>=0.25,<0.26",
  "polars>=1.0,<2",
  "pydantic>=2.8,<3",
  "pydantic-extra-types[pycountry]>=2.11,<3",
  "pyarrow>=17,<25",
  "pyyaml>=6,<7",
  "rapidfuzz>=3.9,<4",
  "rapidocr-onnxruntime>=1.4,<2",
  "ruptures>=1.1,<2",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "skfolio>=0.9,<1",
  "statsforecast>=2,<3",
  "streamlit>=1.40,<2",
  "tenacity>=8.5,<10",
  "trafilatura>=2.0,<3",
]

[project.optional-dependencies]
ingestion = [
  "dlt[duckdb]>=1.0,<2",
  "scrapy>=2.11,<3",
  "playwright>=1.46,<2",
]
extraction = [
  "docling>=2.0,<3",
  "paddleocr>=3.0,<4",
]
knowledge = [
  "splink>=4.0,<5",
]
storage = [
  "dvc>=3.55,<4",
]
transformation = [
  "dbt-duckdb>=1.8,<2",
]
orchestration = [
  "openlineage-python>=1.20,<2",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
  "pytest-timeout>=2.3,<3",
  "reportlab>=4,<5",
  "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_alpha"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings --import-mode=importlib"
testpaths = ["tests"]
markers = [
  "integration: cross-module integration tests",
  "optional_dependency: requires an optional open-source adapter dependency",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["trade_alpha"]
