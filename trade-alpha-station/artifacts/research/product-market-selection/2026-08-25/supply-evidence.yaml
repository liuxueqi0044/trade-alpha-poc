verification_required_before_contact_shortlist:
  - Active status and unified social credit code from the official enterprise registry.
  - Factory address cross-check against environmental, permit, recruitment, procurement, and map evidence.
  - Video or onsite audit of target process, equipment, warehouse, laboratory, and traceability records.
  - Target SKU, material, capacity, MOQ, lead time, subcontracted operations, and change-control disclosure.
  - Export and certification claims verified against certificate issuer, legal entity, site, model, and scope.
  - Sample and third-party test passed before any production commitment.

