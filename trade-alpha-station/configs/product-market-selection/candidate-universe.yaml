schema_version: 1
decision_version: 0.1.0
observed_at: 2026-08-25T00:00:00Z
decision_owner: SOL
status: research_shortlist

scope:
  origin_country: CN
  initial_target_markets: [DE, NL, PL, US]
  note: Other markets may enter only after a documented evidence review.

score_model:
  scale: 1_to_5
  weights:
    demand_fit: 25
    supply_advantage: 20
    execution_simplicity: 20
    transaction_defensibility: 20
    economics_proxy: 15
  components:
    demand_fit: [demand_observability, recurrence, buyer_fragmentation]
    supply_advantage: [supply_breadth, non_platform_discovery, factory_verifiability]
    execution_simplicity: [regulatory_simplicity, logistics_fitness, aftersales_simplicity]
  formula: >-
    raw_total = weighted mean of the five dimensions on a 0-100 scale;
    risk_adjusted_total = raw_total * evidence_confidence.
  warning: >-
    Scores are screening proxies, not observed profit, legal conclusions, or proof of buyer demand.

hard_exclusions:
  - food_or_drinking_water_contact
  - medical_or_respiration_use
  - pressure_retaining_safety_boundary
  - dangerous_media_or_explosive_atmosphere
  - fire_or_life_safety_use
  - structural_or_load_bearing_building_use
  - automotive_safety_or_aviation_or_nuclear_use
  - complete_energized_equipment_without_product_specific_review
  - unclear_customs_classification_or_trade_remedy_scope
  - borrowed_or_mismatched_certificate
  - supplier_without_batch_traceability_or_change_control

stage_definitions:
  primary_poc: Start buyer and factory validation after all hard gates pass.
  challenger: Validate in parallel but do not allocate the main outreach budget yet.
  buyer_led_only: Activate only after a real RFQ/drawing/specification is observed.
  benchmark_only: Track as a commodity control; do not lead with it.
  reserve: Preserve in the universe pending better evidence or a market-specific thesis.
  deferred_risk: Do not enter the first commercial experiment.

